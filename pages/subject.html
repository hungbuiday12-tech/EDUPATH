<body class="subject-page">

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    ☀️
</button>

<div class="page">

    <button class="back-home" onclick="goHome()">
        <span>←</span>
        <span>Về trang chủ</span>
    </button>

    <div class="subject-hero">

        <div class="subject-icon" id="subjectIcon">
            📚
        </div>

        <div>
            <p class="subject-label">MÔN HỌC</p>

            <p id="subjectDescription">
                Học kiến thức và luyện tập cùng EDUPATH.
            </p>
        </div>

    </div>


    <div class="subject-actions">

                📖
            </div>

            <div>
                <h2>Học bài</h2>

                    Học các kiến thức và chủ đề quan trọng.
                </p>
            </div>

        </button>


        <button class="subject-action-card" onclick="openPractice()">

                ✏️
            </div>

            <div>
                <h2>Luyện tập</h2>
                <p>
                    Làm bài tập để củng cố kiến thức.
                </p>
            </div>

        </button>

    </div>


    <button class="subject-ai-card" onclick="openSubjectAI()">

        <div class="subject-ai-icon">
            🤖
        </div>

        <div class="subject-ai-content">
            <h2>AI Trợ giảng</h2>

            <p>
                Hỏi AI về bài học, bài tập hoặc kiến thức
                của <strong id="aiSubjectName">môn học này</strong>.
            </p>
        </div>

        <div class="subject-ai-arrow">
            →
        </div>

    </button>


    <section class="lesson-preview">

        </div>

        <div class="topic-grid" id="topicGrid">
        </div>

    </section>

</div>

const topicGrid = document.getElementById("topicGrid");

    card.className = "topic-card";

    card.innerHTML = `
        <div class="topic-number">
            ${index + 1}
        </div>

        <div>
            <h3>${topic}</h3>
            <p>Khám phá nội dung</p>
        </div>

function openLessons() {

function openPractice() {
