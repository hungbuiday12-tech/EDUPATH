<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUPATH - Đăng nhập</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-page">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    ☀️
</button>

    <button class="back-home" onclick="goHome()">
        <span>←</span>
        <span>Về trang chủ</span>
    </button>

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon">E</div>
                <div>
                    <strong>EDUPATH</strong>
                    <small>Mỗi học sinh – một con đường học tập</small>
                </div>
            </div>

            <!-- ĐĂNG NHẬP -->

            <div id="loginForm">

                <h1>Chào mừng trở lại 👋</h1>

                <p class="auth-description">
                    Đăng nhập để tiếp tục hành trình học tập của bạn.
                </p>

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Nhập email của bạn"
                >

                <label>Mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Nhập mật khẩu"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>

                </div>

                
<div style="text-align: right; margin: 8px 0 16px;">
    <button
        type="button"
        onclick="resetPassword()"
        style="background: none; border: none; color: #7da9ff; cursor: pointer; font-size: 14px;"
    >
        Quên mật khẩu?
    </button>
</div>


                <button class="auth-submit" onclick="login()">
                    Đăng nhập
                </button>

                <p id="loginMessage" class="auth-message"></p>

                <div class="auth-switch">
                    Chưa có tài khoản?
                    <button onclick="showRegister()">
                        Đăng ký ngay
                    </button>
                </div>

            </div>


            <!-- ĐĂNG KÝ -->

            <div id="registerForm" style="display: none;">

                <h1>Tạo tài khoản 🚀</h1>

                <p class="auth-description">
                    Tạo tài khoản để lưu lại hành trình học tập của bạn.
                </p>

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Nhập email của bạn"
                >

                <label>Mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Ít nhất 6 ký tự"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        👁
                    </button>

                </div>

                <label>Nhập lại mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword2"
                        placeholder="Nhập lại mật khẩu"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword2', this)"
                    >
                        👁
                    </button>

                </div>

                <button class="auth-submit" onclick="register()">
                    Tạo tài khoản
                </button>

                <p id="registerMessage" class="auth-message"></p>

                <div class="auth-switch">
                    Đã có tài khoản?
                    <button onclick="showLogin()">
                        Đăng nhập
                    </button>
                </div>

            </div>

        </div>

    </main>



<script type="module">
import { auth } from "../firebase.js";
import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

window.goHome = function() {
    window.location.href = "../index.html";
};

window.showRegister = function() {
    console.log("Da bam nut Dang ky");

    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
};

window.showLogin = function() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
};

window.togglePassword = function(id, button) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.innerText = "🙈";
    } else {
        input.type = "password";
        button.innerText = "👁";
    }
};

window.login = async function() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    if (!email || !password) {
        message.innerText = "Vui lòng nhập đầy đủ email và mật khẩu.";
        return;
    }

    message.innerText = "Đang đăng nhập...";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        message.innerText = "Đăng nhập thành công!";

        // Tạm thời quay về trang chủ.
        // Sau này sẽ chuyển đến trang học tập/tài khoản.
        window.location.href = "../index.html";
    } catch (error) {
        if (error.code === "auth/invalid-credential") {
            message.innerText = "Email hoặc mật khẩu không chính xác.";
        } else if (error.code === "auth/invalid-email") {
            message.innerText = "Email không hợp lệ.";
        } else if (error.code === "auth/too-many-requests") {
            message.innerText = "Bạn thử quá nhiều lần. Vui lòng thử lại sau.";
        } else {
            message.innerText = "Đăng nhập thất bại. Vui lòng thử lại.";
            console.error(error);
        }
    }
};

window.register = async function() {
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const password2 = document.getElementById("registerPassword2").value;
    const message = document.getElementById("registerMessage");

    if (!email || !password || !password2) {
        message.innerText = "Vui lòng nhập đầy đủ thông tin.";
        return;
    }

    if (password.length < 6) {
        message.innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    if (password !== password2) {
        message.innerText = "Mật khẩu nhập lại không giống nhau.";
        return;
    }

    message.innerText = "Đang tạo tài khoản...";

    try {
        await createUserWithEmailAndPassword(auth, email, password);
        message.innerText = "Tạo tài khoản thành công!";
        window.location.href = "../index.html";
    } catch (error) {
        if (error.code === "auth/email-already-in-use") {
            message.innerText = "Email này đã được đăng ký.";
        } else if (error.code === "auth/invalid-email") {
            message.innerText = "Email không hợp lệ.";
        } else if (error.code === "auth/weak-password") {
            message.innerText = "Mật khẩu chưa đủ mạnh.";
        } else {
            message.innerText = "Không thể tạo tài khoản. Vui lòng thử lại.";
            console.error(error);
        }
    }
};

window.resetPassword = async function() {
    const email = document.getElementById("loginEmail").value.trim();
    const message = document.getElementById("loginMessage");

    if (!email) {
        message.innerText = "Hãy nhập email để đặt lại mật khẩu.";
        return;
    }

    try {
        await sendPasswordResetEmail(auth, email);
        message.innerText = "Nếu email hợp lệ, hướng dẫn đặt lại mật khẩu sẽ được gửi đến hộp thư.";
    } catch (error) {
        if (error.code === "auth/invalid-email") {
            message.innerText = "Email không hợp lệ.";
        } else {
            message.innerText = "Chưa thể gửi email. Vui lòng kiểm tra cấu hình Firebase.";
            console.error(error);
        }
    }
};

onAuthStateChanged(auth, (user) => {
    console.log(user ? "Đã đăng nhập:" + user.email : "Chưa đăng nhập");
});


</script>
<script src="../theme.js"></script>
</body>
</html>
